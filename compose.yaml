services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tosec_index
      POSTGRES_USER: tosec
      POSTGRES_PASSWORD: tosec
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tosec-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tosec -d tosec_index"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tosec-postgres:
